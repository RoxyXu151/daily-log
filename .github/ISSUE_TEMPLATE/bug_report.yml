name: 问题反馈 (Bug Report)
description: 报告采集、整理、表格同步、桌面端或移动访问中的异常行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简明说明发生了什么，以及预期行为是什么。（请勿粘贴真实 API Key、令牌或隐私日志内容）
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - CLI 与核心流程 (cmd/daily-log)
        - 桌面工作台 (desktop / MyGo)
        - Android 浏览器访问 (mobile)
        - 来源采集器 (Zotero / Todoist / Codex / GitHub 等)
        - 表格同步 (Google Sheets / Excel)
        - 定时任务 (systemd / Task Scheduler)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、Go 版本及 daily-log 版本
      placeholder: "例如：Ubuntu 24.04 / Windows 11, Go 1.27.3, daily-log 0.3.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤与脱敏日志
      description: 提供最小复现步骤或脱敏后的报错输出
    validations:
      required: true
